name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r services/api/requirements-core.txt
      - run: python -m alembic upgrade head
        working-directory: services/api
      - run: python -m pytest -q
        working-directory: services/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install the local Office preview converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Test the production build in Chromium
        run: python scripts/run_browser_tests.py --production
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: apps/web/test-results/
